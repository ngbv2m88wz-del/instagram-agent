[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-agent"
version = "0.1.0"
description = "Агент для просмотра и анализа Instagram-аккаунта"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "anthropic>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
instagram-agent = "instagram_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
